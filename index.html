<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AsaKorte — Pickleball courts in Mindanao</title>
  <meta name="description" content="Asa ang korte? Find pickleball courts near you in Davao, CDO, GenSan, Zamboanga and all over Mindanao. See who is open now, the rates, open play tonight, and book in one tap.">
  <meta name="theme-color" content="#0B1B3A">
  <meta property="og:title" content="AsaKorte — Pickleball courts in Mindanao">
  <meta property="og:description" content="Find a court near you, check if it is open, and book in one tap.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AsaKorte">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" id="brand-link" aria-label="AsaKorte home">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="16" fill="#1D4ED8"/>
        <circle cx="32" cy="32" r="20" fill="#D4F43B"/>
        <g fill="#0B1B3A">
          <circle cx="32" cy="32" r="2.4"/>
          <circle cx="32" cy="22" r="2.4"/><circle cx="32" cy="42" r="2.4"/>
          <circle cx="23.3" cy="27" r="2.4"/><circle cx="40.7" cy="27" r="2.4"/>
          <circle cx="23.3" cy="37" r="2.4"/><circle cx="40.7" cy="37" r="2.4"/>
          <circle cx="42" cy="18.5" r="2"/><circle cx="22" cy="18.5" r="2"/>
          <circle cx="42" cy="45.5" r="2"/><circle cx="22" cy="45.5" r="2"/>
          <circle cx="47" cy="32" r="2"/><circle cx="17" cy="32" r="2"/>
        </g>
      </svg>
      <span>
        <span class="brand-name">Asa<em>Korte</em></span>
        <span class="brand-tag">Pickleball courts in Mindanao</span>
      </span>
    </a>
    <button class="install-btn" id="btn-install" hidden type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>
      Install
    </button>
    <button class="icon-btn" id="btn-theme" type="button" aria-label="Switch theme" title="Theme"></button>
  </header>

  <main id="main">
    <!-- ───────── Explore ───────── -->
    <section id="view-explore" class="view active" aria-label="Explore courts">
      <div class="hero">
        <h1>Asa ang <em>korte?</em></h1>
        <p>Find a pickleball court near you, see who is open right now, and book in one tap.</p>
        <label class="search" for="q">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Court name, barangay, city…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
          <button class="clear" id="q-clear" type="button" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </label>
        <div class="locate-row">
          <button class="btn-locate" id="btn-locate" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            Near me
          </button>
          <div class="locate-note" id="locate-note">Pick a city or tap Near me. No sign-up needed.</div>
        </div>
        <div class="chip-row in-hero" id="city-chips" role="tablist" aria-label="Cities"></div>
      </div>
      <div class="chip-row" id="quick-chips" aria-label="Quick filters"></div>
      <div id="banner-root"></div>
      <div class="results-head">
        <h2 id="results-title">Courts</h2>
        <select class="sort-select" id="sort" aria-label="Sort courts">
          <option value="smart">Best match</option>
          <option value="distance">Nearest</option>
          <option value="price">Cheapest</option>
          <option value="courts">Most courts</option>
          <option value="rating">Top rated</option>
          <option value="name">A to Z</option>
        </select>
      </div>
      <div class="court-list" id="court-list"></div>
    </section>

    <!-- ───────── Map ───────── -->
    <section id="view-map" class="view" aria-label="Map">
      <div class="map-wrap">
        <div id="map"></div>
        <div class="map-loading" id="map-loading"><div class="spinner"></div><div>Loading map…</div></div>
        <div class="map-topbar"><div class="chip-row" id="map-city-chips"></div></div>
        <div class="map-notice" id="map-notice" role="status" hidden></div>
        <button class="map-fab" id="map-locate" type="button" aria-label="Show my location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
        <div class="map-preview" id="map-preview"></div>
      </div>
    </section>

    <!-- ───────── Open play ───────── -->
    <section id="view-play" class="view" aria-label="Open play"></section>

    <!-- ───────── Saved ───────── -->
    <section id="view-saved" class="view" aria-label="Saved courts"></section>

    <!-- ───────── More ───────── -->
    <section id="view-more" class="view" aria-label="More"></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Main">
    <button class="tab active" data-tab="explore" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Explore
    </button>
    <button class="tab" data-tab="map" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
      Map
    </button>
    <button class="tab" data-tab="play" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg>
      Open play
    </button>
    <button class="tab" data-tab="saved" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z"/></svg>
      Saved
    </button>
    <button class="tab" data-tab="more" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      More
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/core/geo.js"></script>
  <script src="js/core/hours.js"></script>
  <script src="js/core/links.js"></script>
  <script src="js/core/filters.js"></script>
  <script src="js/core/availability.js"></script>
  <script src="js/data/cities.js"></script>
  <script src="js/data/courts.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/availability.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
